openapi: 3.0.0
info: {title: API Portal - Certificate Stores - KeyStore (CF), description: 'This API allows you to create and manage CertificateStores. To use this API, ensure that the role APIPortal.Administrator is assigned to you.', version: '1.0', x-targetEndpoint: 'https://us10trialapiportal.cfapps.us10.hana.ondemand.com/apiportal/api/1.0/Management.svc/'}
x-sap-shortText: Enables you to create and view CertificateStores - KeyStore .
x-sap-api-type: ODATA
security:
- OAuth2_ClientCredentials: []
externalDocs: {description: Business Documentation, url: 'https://help.sap.com/docs/sap-api-management/sap-api-management/manage-certificates'}
servers:
- {url: 'https://sandbox.api.sap.com/sapapimanagement/apiportal/Management.svc', description: API Portal Sandbox API endpoint}
- url: https://{apiportal-url}/apiportal/api/1.0/Management.svc
  description: API Portal API endpoint
  variables:
    apiportal-url: {description: API Portal API endpoint, default: ''}
tags:
- {name: Certificate Stores}
paths:
  /CertificateStores:
    get:
      summary: Entities from CertificateStores
      description: Returns all the CertificateStores for the tenant.
      tags: [Certificate Stores]
      parameters:
      - name: $top
        in: query
        description: Show only the first n items
        schema: {type: integer}
      - name: $skip
        in: query
        description: Skip the first n items
        schema: {type: integer}
      - name: $count
        in: query
        description: Include count of items
        schema: {type: boolean}
      - name: $filter
        in: query
        description: Filter items by property values
        schema:
          type: array
          items: {type: string}
        examples:
          storeType: {value: storeType}
          name: {value: name}
      - name: $search
        in: query
        description: Search items by search phrases
        schema:
          type: array
          items: {type: string}
        examples:
          storeType: {value: storeType}
          name: {value: name}
      - name: $orderby
        in: query
        description: Order items by property values
        schema:
          type: array
          items: {type: string}
        examples:
          life_cycle: {value: life_cycle}
          name: {value: name}
      - name: $select
        in: query
        description: Select properties to be returned
        schema:
          type: array
          items: {type: string}
        examples:
          life_cycle: {value: life_cycle}
          storeType: {value: storeType}
      responses:
        '200':
          description: Retrieved all the CertificateStores entities
          content:
            application/json:
              schema:
                type: object
                title: Collection of CertificateStores
                properties:
                  results:
                    type: array
                    items: {$ref: '#/components/schemas/apimgmtconfiguration.CertificateStores'}
        default: {$ref: '#/components/responses/error'}
    post:
      summary: Create CertificateStores Entity
      description: Create CertificateStores entity. Supported formats are PKCS/PFX(.p12).
      tags: [Certificate Stores]
      requestBody:
        description: Create New entity
        content:
          application/json:
            schema: {$ref: '#/components/schemas/apimgmtconfiguration.CertificateStoreKS-create'}
      responses:
        '201':
          description: Created entity
          content:
            application/json:
              schema: {title: Created CertificateStores, $ref: '#/components/schemas/apimgmtconfiguration.CertificateStores'}
        '400':
          description: Bad Request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/odata.error'}
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema: {$ref: '#/components/schemas/odata.error'}
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/odata.error'}
        default: {$ref: '#/components/responses/error'}
  /CertificateStores('{name}'):
    get:
      summary: Entity from CertificateStores
      description: Returns the CertificateStore entity by key
      tags: [Certificate Stores]
      parameters:
      - name: name
        in: path
        required: true
        description: 'key: name'
        schema: {type: string}
      - name: $select
        in: query
        description: Select properties to be returned
        schema:
          type: array
          items: {type: string}
        examples:
          life_cycle: {value: life_cycle}
          allocationStatus: {value: allocationStatus}
      responses:
        '200':
          description: CertificateStores Entity
          content:
            application/json:
              schema: {type: object, title: CertificateStores Entity, $ref: '#/components/schemas/apimgmtconfiguration.CertificateStores'}
        '404':
          description: Requested entity could not be found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/odata.error'}
        default: {$ref: '#/components/responses/error'}
    delete:
      summary: Delete CertificateStores Entity
      description: "Deletes a CertificateStore entity by key.\n\n**Note:** \n- The store must exist.\n- The store must not contain any certificates.\n- The store must not have any API Providers linked to it."
      tags: [Certificate Stores]
      parameters:
      - name: name
        in: path
        required: true
        description: 'key: name'
        schema: {type: string}
      responses:
        '204': {description: CertificateStore successfully deleted}
        '400':
          description: Bad Request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/odata.error'}
              examples:
                NO_SUCH_CERTIFICATE_STORE_EXISTS_MSG:
                  summary: Certificate Store does not exist
                  value:
                    error:
                      code: NO_SUCH_CERTIFICATE_STORE_EXISTS_MSG
                      message: {lang: en, value: The Certificate Store whose deletion is attempted does not exist.}
                CERTIFICATE_STORE_DELETE_LINKED_CERTIFICATE_VALIDATION_ERROR_MSG:
                  summary: Certificate Store has linked certificates or API Providers
                  value:
                    error:
                      code: CERTIFICATE_STORE_DELETE_LINKED_CERTIFICATE_VALIDATION_ERROR_MSG
                      message: {lang: en, value: The Certificate Store cannot be deleted as it still has certificates or API Providers linked to it.}
        default: {$ref: '#/components/responses/error'}
components:
  securitySchemes:
    OAuth2_ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{tokenUrl}/oauth/token?grant_type=client_credentials
          scopes: {}
  parameters:
    top:
      name: $top
      in: query
      description: Show only the first n items
      schema: {type: integer}
    skip:
      name: $skip
      in: query
      description: Skip the first n items
      schema: {type: integer}
    count:
      name: $count
      in: query
      description: Include count of items
      schema: {type: boolean}
    filter:
      name: $filter
      in: query
      description: Filter items by property values
      schema: {type: string}
    search:
      name: $search
      in: query
      description: Search items by search phrases
      schema: {type: string}
    orderby:
      name: $orderby
      in: query
      description: Order items by property values
      schema:
        type: array
        items: {type: string}
    select:
      name: $select
      in: query
      description: Select properties to be returned
      schema:
        type: array
        items: {type: string}
  schemas:
    apimgmtconfiguration.CertificateStores:
      type: object
      properties:
        name: {type: string, maxLength: 255, description: The name of the CertificateStore.}
        storeType: {type: string, maxLength: 20, description: Defines the certificateStore type KEY STORE or TRUST STORE.}
        life_cycle:
          allOf:
          - {$ref: '#/components/schemas/apimgmtconfiguration.History'}
      title: CertificateStores
    apimgmtconfiguration.CertificateStoreKS-create:
      type: object
      required: [name, storeType, certificates]
      properties:
        name: {type: string, maxLength: 255, description: The name of the CertificateStore.}
        storeType: {type: string, maxLength: 200, description: The storeType either keyStore or TrustStore.}
        certificates:
          allOf:
          - {$ref: '#/components/schemas/apimgmtconfiguration.certificates'}
      title: CertificateStore - KeyStore - CREATE
    apimgmtconfiguration.certificates:
      type: object
      required: [name, content]
      properties:
        name: {type: string, maxLength: 200, description: The name of the certificate.}
        description: {type: string, maxLength: 200, description: The description of the certificate.}
        content: {type: string, format: byte, description: The certificate content in Base64 format.}
        format: {type: string, maxLength: 256, description: The certificate format PKCS/PFX(.p12).}
        password: {type: string, format: byte, description: 'Key has a password, specify the Password.'}
      title: KeyStore - Certificate - Create
    apimgmtconfiguration.History:
      type: object
      properties:
        changed_at: {type: string, default: 'null', example: /Date(1710311576000)/}
        changed_by: {type: string, default: 'null', maxLength: 255}
        created_at: {type: string, default: 'null', example: /Date(1710311576000)/}
        created_by: {type: string, default: 'null', maxLength: 255}
      title: History
    odata.error:
      type: object
      properties:
        error: {$ref: '#/components/schemas/odata.error.main'}
    odata.error.main:
      type: object
      properties:
        code: {type: string}
        message: {$ref: '#/components/schemas/odata.error.message'}
        innererror: {description: The contents of this object are service-defined}
    odata.error.message:
      type: object
      properties:
        lang: {type: string}
        value: {type: string}
  responses:
    error:
      description: Default error response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/odata.error'}
