paths:
  /Rules:
    get:
      summary: Get all available rules.
      description: This operation lists all the rules available in access control list.
      tags: [Rules]
      parameters:
      - {$ref: '#/parameters/filter'}
      responses:
        '200':
          description: Retrieved rules
          schema:
            type: object
            title: Wrapper
            properties:
              d:
                type: object
                title: Collection of ACL Rules
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/acl.Rule'}
        default: {$ref: '#/responses/error'}
    post:
      summary: Create a rule
      description: Create a new rule for a specific product. Specify the product name in the entity Id field. Supported action types are Discover and Subscription.
      tags: [Rules]
      parameters:
      - name: ACLRule
        in: body
        description: New rule
        required: true
        schema: {$ref: '#/definitions/acl.Rule'}
      responses:
        '201':
          description: Created entity
          schema:
            title: Created APIProduct
            type: object
            properties:
              d: {$ref: '#/definitions/acl.Rule'}
        '400':
          description: Bad Request
          schema: {$ref: '#/definitions/odata.error'}
        '415':
          description: Unsupported Media Type
          schema: {$ref: '#/definitions/odata.error'}
        '500':
          description: Internal Server Error
          schema: {$ref: '#/definitions/odata.error'}
        default: {$ref: '#/responses/error'}
  /Rules('{ruleId}'):
    get:
      summary: Get a specific rule from ACL by key.
      description: Returns the rule with the key from ACL.
      tags: [Rules]
      parameters:
      - {name: ruleId, in: path, required: true, description: 'key: rule ID', type: string}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: APIProduct
            type: object
            properties:
              d: {$ref: '#/definitions/acl.Rule'}
        default: {$ref: '#/responses/error'}
    delete:
      summary: Delete a specific rule.
      description: This operation deletes a specifc rule identified using the ruleid.
      tags: [Rules]
      parameters:
      - {name: ruleId, in: path, required: true, description: 'key: rule ID', type: string}
      responses:
        '204': {description: Success}
        default: {$ref: '#/responses/error'}
