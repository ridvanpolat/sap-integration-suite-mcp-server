    error:
      description: Error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/error'}
  securitySchemes:
    OAuth2_ClientCredentials:
      description: Authentication via OAuth2 with client credentials flow
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{tokenUrl}/oauth/token?grant_type=client_credentials
          scopes: {config: Configuration API access.}
    OAuth2_AuthorizationCode:
      description: Authentication via OAuth2 with authorization code flow
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://example.com/api/oauth/dialog
          tokenUrl: https://example.com/api/oauth/token
          refreshUrl: https://example.com/api/oauth/refresh
          scopes: {config: Configuration API access.}
security:
- OAuth2_ClientCredentials: []
- OAuth2_AuthorizationCode: []
