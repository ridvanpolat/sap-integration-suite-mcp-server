openapi: 3.0.0
info:
  title: API Portal - Analytics (CF)
  version: '1.0'
  description: |-
    Advanced Analytics API brings you a comprehensive data, that includes powerful analytical reporting tools to analyze your API usage, Performance and also any errors if occurred during API call.

    Note: The response is sent in paginated format with a maximum of 10,000 records per response. It is recommended to use appropriate filters to fetch only the required data. If the dataset exceeds 10,000 records even after applying filters, use pagination to retrieve the remaining records.
x-sap-shortText: Enables you to view API Usage and Performance Data.
x-sap-longDescription: |-
  Advanced Analytics API brings you a comprehensive data, that includes powerful analytical reporting tools to analyze your API usage, performance and also any errors if occurred during API call.

  Note: The response is sent in paginated format with a maximum of 10,000 records per response. It is recommended to use appropriate filters to fetch only the required data. If the dataset exceeds 10,000 records even after applying filters, use pagination to retrieve the remaining records.
x-sap-api-type: ODATAV4
x-odata-version: '4.0'
