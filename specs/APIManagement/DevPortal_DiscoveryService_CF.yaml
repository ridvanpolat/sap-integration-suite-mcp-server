x-odata-version: '4.0'
swagger: '2.0'
info: {title: Developer Hub - Discovery Service (CF), description: 'API Discovery services enable the automatic discovery of APIs and the associated machine readable API definitions, which allows the client consumption libraries both from SAP and Third Party to identify the right APIs to quickly prototype and build applications', version: '1.0', x-targetEndpoint: 'https://us10trialdevportal.cfapps.us10.hana.ondemand.com/apidiscovery/v1'}
securityDefinitions:
  OAuth2_ClientCredentials:
    type: oauth2
    flow: application
    tokenUrl: https://{tokenUrl}/oauth/token?grant_type=client_credentials
    scopes: {}
security:
- OAuth2_ClientCredentials: []
externalDocs: {description: Business Documentation, url: 'https://help.sap.com/viewer/66d066d903c2473f81ec33acfe2ccdb4/Cloud/en-US/5cb804c4913543a8855225f88c26af83.html'}
x-sap-api-type: ODATA
host: sandbox.api.sap.com
schemes: [https]
x-sap-shortText: Enables you to identify the right API to quickly prototype and build applications.
basePath: /sapapimanagement/apidiscovery/v1
x-servers:
