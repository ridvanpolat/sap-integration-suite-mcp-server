paths:
  /APIMgmt.APIProducts:
    get:
      tags: [API Product]
      summary: Get all Product entities
      description: A product is a vehicle that lets the Application developer know which APIs are exposed on the API Management portal. When you create an application, you select the Product to include in the application. For each application that you create, API Management generates an Application key and secret. Use this key to gain access to multiple products.
      produces: [application/json]
      parameters: []
      responses:
        '200':
          description: Retrieved entities
          schema:
            type: object
            title: Wrapper
            properties:
              d:
                type: object
                title: Collection of APIProducts
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/developer.APIProductsType'}
        default: {$ref: '#/responses/error'}
  /APIMgmt.APIProducts('{name}'):
    get:
      tags: [API Product]
      summary: Get a specific product
      description: A product is a vehicle that lets the Application developer know which APIs are exposed on the API Management portal. When you create an application, you select the Product to include in the application. For each application that you create, API Management generates an Application key and secret. Use this key to gain access to multiple products.
      produces: [application/json]
      parameters:
      - {name: name, description: name, in: path, required: true, type: string, format: ''}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: APIProduct
            type: object
            properties:
              d: {$ref: '#/definitions/developer.APIProductsType'}
        default: {$ref: '#/responses/error'}
  /APIMgmt.APIProxies:
    get:
      tags: [API Proxy]
      summary: Get all entities from API Proxy
      description: An API is exposed in API Management as an API Proxy. An API Proxy is a discrete representation of an API. It is implemented as a set of configuration files, policies, and code snippets that rely on the resource information provided by API Management. The API Proxy decouples an API from any backend changes. This provides flexibility to application developers to continue calling the same API.
      produces: [application/json]
      parameters: []
      responses:
        '200':
          description: Retrieved entities
          schema:
            type: object
            title: Wrapper
            properties:
              d:
                type: object
                title: Collection of APIProxies
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/developer.APIProxiesType'}
        default: {$ref: '#/responses/error'}
  /APIMgmt.APIProxies('{name}'):
    get:
      tags: [API Proxy]
      summary: Get a specific entity from API Proxy
      description: An API is exposed in API Management as an API Proxy. An API Proxy is a discrete representation of an API. It is implemented as a set of configuration files, policies, and code snippets that rely on the resource information provided by API Management. The API Proxy decouples an API from any backend changes. This provides flexibility to application developers to continue calling the same API.
      produces: [application/json]
      parameters:
      - {name: name, description: name, in: path, required: true, type: string, format: ''}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: APIProxy
            type: object
            properties:
              d: {$ref: '#/definitions/developer.APIProxiesType'}
        default: {$ref: '#/responses/error'}
