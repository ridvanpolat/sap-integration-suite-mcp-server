openapi: 3.0.0
info: {title: Entities, description: Maintain ISA-M settings and landscape information. Retrieve reports of assessments including requests and decisions. Create and manage requests., version: 1.0.0}
servers:
- url: https://intas-api.cfapps.{domain}/intas/entities/v1
  variables:
    domain:
      description: SAP BTP Region Host
      default: ''
      enum: [ap10.hana.ondemand.com, ap11.hana.ondemand.com, ap12.hana.ondemand.com, ap20.hana.ondemand.com, ap21.hana.ondemand.com, ap30.hana.ondemand.com, br10.hana.ondemand.com, br20.hana.ondemand.com, ca10.hana.ondemand.com, ca20.hana.ondemand.com, ch20.hana.ondemand.com, eu10.hana.ondemand.com, eu11.hana.ondemand.com, eu20.hana.ondemand.com, eu30.hana.ondemand.com, il30.hana.ondemand.com, in30.hana.ondemand.com, jp10.hana.ondemand.com, jp20.hana.ondemand.com, sa30.hana.ondemand.com, sa31.hana.ondemand.com, us10.hana.ondemand.com, us11.hana.ondemand.com, us20.hana.ondemand.com, us21.hana.ondemand.com, us30.hana.ondemand.com]
tags:
- {name: Domain}
- {name: Style}
- {name: UseCasePattern}
- {name: IntegrationPattern}
- {name: KeyCharacteristic}
- {name: KeyCharacteristicGroup}
- {name: KeyCharacteristicValue}
- {name: KeyCharacteristicRecommendationDegree}
- {name: DeploymentModel}
- {name: DomainDetermination}
- {name: Application}
- {name: ApplicationInstance}
- {name: Technology}
- {name: TechnologyInstance}
- {name: TechnologyDomain}
- {name: TechnologyStyle}
- {name: TechnologyKeyCharacteristic}
- {name: Vendor}
- {name: Request}
- {name: RequestLineItem}
- {name: IntegrationFlow}
- {name: MessageFlow}
- {name: IntegrationFlowMessageFlow}
- {name: RequestLineItemTechnologyInstanceDecision}
paths:
  /Application:
    get:
      summary: Retrieve all applications.
      tags: [Application]
      parameters:
      - {$ref: '#/components/parameters/top'}
      - {$ref: '#/components/parameters/skip'}
      - name: $filter
        in: query
        description: Filter items by property values
        schema: {type: string}
      - {$ref: '#/components/parameters/count'}
      - name: $orderby
        in: query
        description: Order items by property values
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [Id, Id desc, CreatedAt, CreatedAt desc, ModifiedAt, ModifiedAt desc, Name, Name desc, ApiHubId, ApiHubId desc]
      - name: $select
        in: query
        description: Select properties to be returned
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [Id, CreatedAt, ModifiedAt, Name, ApiHubId, ApplicationInstances, Vendor]
      - name: $expand
        in: query
        description: Expand related entities
        explode: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ApplicationInstances, Vendor]
      responses:
        '200':
          description: Retrieved Application
          content:
            application/json:
              schema:
                title: Wrapper
                type: object
                properties:
                  d:
                    title: Collection of Application
                    type: object
                    properties:
                      __count: {$ref: '#/components/schemas/count'}
                      results:
                        type: array
                        items: {$ref: '#/components/schemas/com.sap.intas.entities.Application'}
        '400': {$ref: '#/components/responses/error_400'}
        '401': {$ref: '#/components/responses/error_401'}
        '403': {$ref: '#/components/responses/error_403'}
      description: "Retrieve the list of applications. \n"
    post:
      summary: |
        Create new application.
      tags: [Application]
      requestBody:
        required: true
        description: 'Name: name of application, ApiHubId: Technical name of application on SAP Business Accelerator Hub, Vendor: Vendor of application'
        content:
          application/json:
            schema: {$ref: '#/components/schemas/com.sap.intas.entities.Application-create'}
      responses:
        '201':
          description: Created Application
          content:
            application/json:
              schema:
                title: Application
                type: object
                properties:
                  d: {$ref: '#/components/schemas/com.sap.intas.entities.Application-create'}
        '400': {$ref: '#/components/responses/error_400'}
        '401': {$ref: '#/components/responses/error_401'}
        '403': {$ref: '#/components/responses/error_403'}
        '409': {$ref: '#/components/responses/error_409'}
      description: |
        Create new application according to the specified values.
