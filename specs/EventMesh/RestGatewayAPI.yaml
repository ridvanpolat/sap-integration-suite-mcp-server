  /messagingrest/v1/messages/consumption:
    post:
      tags: [Synchronous Messaging]
      summary: Consume message from a queue based on the x-address header value.
      description: Message is consumed from the queue provided in header. When number of messages in queue are less than 3 the API might result with no messages at times, in this case its recommend to poll again. Recommended to use this API only for testing.
      parameters:
      - name: x-address
        in: header
        description: Queue address, detail of the queue needs to be specified as 'queue://'or 'queue:'. Example values 'queue:default/app/1/my-queue', 'queue://default/app/1/my-queue'
        required: true
        schema: {type: string}
      - name: x-qos
        in: header
        description: Quality of service, where 0 specifies "at most once", and 1 specifies "at least once" (requires acknowledgment).
        required: true
        schema:
          type: integer
          enum: [0, 1]
      responses:
        '200':
          description: Message in response body.
          content:
            any-content-type: {example: string}
          headers:
            Content-Type:
              schema: {type: string}
              description: Content type of the message.
            X-Message-Id:
              schema: {type: string}
              description: 'A unique identifier for the message, required when acknowledging messages which consumed with x-qos: 1. Ensure this ID is included in the Acknowledgement API to acknowledge message. Omission may result in message redelivery'
        '204': {description: If queue is empty.}
        '400':
          description: In cases of invalid values for request parameters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                invalid_x-qos:
                  summary: x-qos is invalid
                  value:
                    error: {code: INVALID_INPUT, message: x-qos value is invalid}
                    message: x-qos value is invalid
                invalid_queue_name:
                  summary: Invalid queue name
                  value:
                    error: {code: INVALID_INPUT, message: invalid queue name}
                    message: invalid queue name
        '401':
          description: In case of invalid credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                empty_message:
                  summary: Invalid credentials
                  value:
                    error: {code: UNAUTHORIZED, message: Unauthorized}
                    message: Unauthorized
        '404':
          description: If queue does not exist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                empty_message:
                  summary: Queue not found
                  value:
                    error: {code: '400', message: 'Queue name: ''<queue-name>'' not found'}
                    message: 'Queue name: ''<queue-name>'' not found'
        '422':
          description: If limit on resources reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                empty_message:
                  summary: Resource limit reached
                  value:
                    error: {code: UNPROCESSABLE_ENTITY, message: string}
                    message: string
        '429':
          description: If too many polling requests are received by service.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                empty_message:
                  summary: Too many requests
                  value:
                    error: {code: TOO_MANY_REQUESTS, message: string}
                    message: string
  /messagingrest/v1/queues/{queue-name}/messages/consumption:
    post:
      tags: [Synchronous Messaging]
      summary: Consume message from a queue
      description: Polls for messages in the queue. Queue name should be URL encoded. When number of messages in queue are less than 3 the API might result with no messages at times, in this case its recommend to poll again. Recommended to use this API only for testing.
      parameters:
      - name: x-qos
        in: header
        description: Quality of service, where 0 specifies "at most once", and 1 specifies "at least once" (requires acknowledgment).
        required: true
        schema:
          type: integer
          enum: [0, 1]
      - name: queue-name
        in: path
        description: URL-encoded queue name
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Message in response body.
          content:
            any-content-type: {example: string}
          headers:
            Content-Type:
              schema: {type: string}
              description: Content type of the message.
            X-Message-Id:
              schema: {type: string}
              description: Message id that must be passed in acknowledgement API. Available only if its consumed with x-qos 1
        '204': {description: If queue is empty.}
        '400':
          description: In cases of invalid values for request parameters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                invalid_x-qos:
                  summary: x-qos is invalid
                  value:
                    error: {code: INVALID_INPUT, message: x-qos value is invalid}
                    message: x-qos value is invalid
        '401':
          description: In case of invalid credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                empty_message:
                  summary: Invalid credentials
                  value:
                    error: {code: UNAUTHORIZED, message: Unauthorized}
                    message: Unauthorized
        '404':
          description: If queue does not exist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                empty_message:
                  summary: Queue not found
                  value:
                    error: {code: '400', message: 'Queue name: ''<queue-name>'' not found'}
                    message: 'Queue name: ''<queue-name>'' not found'
        '422':
          description: If limit on resources reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                empty_message:
                  summary: Resource limit reached
                  value:
                    error: {code: UNPROCESSABLE_ENTITY, message: string}
                    message: string
        '429':
          description: If too many polling requests are received by service.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                empty_message:
                  summary: Too many requests
                  value:
                    error: {code: TOO_MANY_REQUESTS, message: string}
                    message: string
  /messagingrest/v1/queues/{queue-name}/messages/{message-id}/acknowledgement:
    post:
      tags: [Synchronous Messaging]
      summary: Acknowledge message consumption
      description: This API should be used to acknowledge the messages consumed using x-qos 1
      parameters:
      - name: queue-name
        in: path
        description: URL-encoded queue name
        required: true
        schema: {type: string}
      - name: message-id
        in: path
        description: Message id as received in X-Message-Id header of message consumption API
        required: true
        schema: {type: string}
      responses:
        '202': {description: Request for acknowledging message is accepted}
        '400':
          description: In cases of invalid values for request parameters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                invalid_queue-name:
                  summary: invalid queue name
                  value:
                    error: {code: INVALID_INPUT, message: invalid queue name}
                    message: invalid queue name
                invalid_message-id:
                  summary: invalid message id
                  value:
                    error: {code: INVALID_INPUT, message: invalid message-id}
                    message: invalid message-id
        '401':
          description: In case of invalid credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponseObject'}
              examples:
                empty_message:
                  summary: Invalid credentials
                  value:
                    error: {code: UNAUTHORIZED, message: Unauthorized}
                    message: Unauthorized
components:
  securitySchemes:
    oAuth2:
      type: oauth2
      description: This API uses OAuth 2 with client credentials flow
      flows:
        clientCredentials:
          tokenUrl: https://{subdomain(identity_zone)}.authentication.{host}/oauth/token
          scopes: {}
  schemas:
    ErrorResponseObject:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
        message: {type: string}
  examples:
    text-message: {value: A sample message}
