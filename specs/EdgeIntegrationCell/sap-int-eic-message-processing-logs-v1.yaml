                - {Id: 'sap-it-res:msg:ae15c0dda:a499bb96-a9c8-4aaf-9da4-da9fbb188f63', MessageGuid: AFq478Bblxi4wCjBcDb_G0vAGGZG, TimeStamp: /Date(1522069440106)/, Name: Test Attachment2, ContentType: text/plain, PayloadSize: '56'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageProcessingLogs('{MessageGuid}')/CustomHeaderProperties:
    get:
      summary: Get all custom header properties of a specific message processing log
      description: You can use the following request to get custom header properties of the message processing log with the specified message Guid.
      tags: [Custom Header Properties]
      parameters:
      - {name: MessageGuid, in: path, required: true, description: Guid of the message for which the message processing log is written, type: string}
      - {$ref: '#/parameters/top'}
      - {$ref: '#/parameters/skip'}
      - {name: $filter, in: query, description: Filter items by property values, type: string}
      - name: $orderby
        in: query
        description: Order items by property values
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [Name, Name desc, 'Name,Value', Value desc]
      - name: $select
        in: query
        description: Select properties to be returned.
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [Id, Name, Value]
      responses:
        '200':
          description: Retrieved entities
          schema:
            title: Collection of MessageProcessingLogCustomHeaderProperty
            type: object
            properties:
              d:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/com.sap.hci.api.MessageProcessingLogCustomHeaderProperty'}
          examples:
            application/json:
              d:
                results:
                - {Id: '166', Name: myCustomHeaderProperty, Value: myCustomHeaderPropertyValue}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageProcessingLogs('{MessageGuid}')/ErrorInformation:
    get:
      description: You can use the following request to get error information for the message with the specified message Guid.
      summary: Get error information of message processing log by message Guid.
      tags: [Error Information]
      parameters:
      - {name: MessageGuid, in: path, required: true, description: Guid of the message for which the message processing log is written, type: string}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: MessageProcessingLogErrorInformation
            type: object
            properties:
              d: {$ref: '#/definitions/com.sap.hci.api.MessageProcessingLogErrorInformation'}
          examples:
            application/json:
              d: {MessageGuid: AFq478Bblxi4wCjBcDb_G0vAGGZG, Type: text/plain, LastErrorModelStepId: MessageFlow_11}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageProcessingLogs('{MessageGuid}')/ErrorInformation/$value:
    get:
      description: You can use the following request to get error information text for the message with the specified message Guid.
      summary: Get error information text of message processing log by message Guid.
      tags: [Error Information]
      parameters:
      - {name: MessageGuid, in: path, required: true, description: Guid of the message for which the message processing log is written, type: string}
      responses:
        '200': {description: Retrieved error information text}
        '400': {$ref: '#/responses/400'}
