        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageProcessingLogs('{MessageGuid}'):
    get:
      description: You can use the following request to get a message processing log by message Guid.
      summary: Get message processing log by message Guid.
      tags: [Logs]
      parameters:
      - {name: MessageGuid, in: path, required: true, description: Guid of the message for which the message processing log is written, type: string}
      - name: $select
        in: query
        description: Select properties to be returned.
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [CorrelationId, ApplicationMessageId, PredecessorMessageGuid, ApplicationMessageType, IntegrationFlowName, IntegrationArtifact, Status, CustomStatus, LogLevel, LogStart, LogEnd, Sender, Receiver, AlternateWebLink, ArchivingStatus, ArchivingSenderChannelMessages, ArchivingReceiverChannelMessages, ArchivingLogAttachments, ArchivingPersistedMessages]
      - name: $expand
        in: query
        description: Expand related entities.
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [AdapterAttributes, CustomHeaderProperties]
      responses:
        '200':
          description: Retrieved message processing log
          schema:
            title: MessageProcessingLog
            type: object
            properties:
              d: {$ref: '#/definitions/com.sap.hci.api.MessageProcessingLog'}
          examples:
            application/json:
              d:
                MessageGuid: AFq478Bblxi4wCjBcDb_G0vAGGZG
                CorrelationId: AFq478Bmn-aPieAWVy0mMGPLWsjx
                ApplicationMessageId: null
                PredecessorMessageGuid: null
                ApplicationMessageType: null
                LogStart: /Date(1522069440003)/
                LogEnd: /Date(1522069440200)/
                Sender: null
                Receiver: null
                IntegrationFlowName: IntegrationFlow_AdapterData_FAILED_PROCESSING
                Status: FAILED
                AlternateWebLink: https://api.virtual.host/itspaces/shell/monitoring/MessageDetails/%7B%22messageGuid%22%3A%22AFq478Bblxi4wCjBcDb_G0vAGGZG%22%7D
                IntegrationArtifact: {Id: IntegrationFlow_AdapterData_FAILED_PROCESSING, Name: Integration Flow with Adapter Data - FAILED PROCESSING, Type: INTEGRATION_FLOW, PackageId: PackageId, PackageName: PackageName}
                LogLevel: INFO
                CustomStatus: FAILED
                ArchivingStatus: NOT_RELEVANT
                ArchivingSenderChannelMessages: 'false'
                ArchivingReceiverChannelMessages: 'false'
                ArchivingLogAttachments: 'false'
                ArchivingPersistedMessages: 'false'
                CustomHeaderProperties:
                  __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/CustomHeaderProperties'}
                MessageStoreEntries:
                  __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/MessageStoreEntries'}
                ErrorInformation:
                  __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/ErrorInformation'}
                AdapterAttributes:
                  __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/AdapterAttributes'}
                Attachments:
                  __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/Attachments'}
                Runs:
                  __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/Runs'}
