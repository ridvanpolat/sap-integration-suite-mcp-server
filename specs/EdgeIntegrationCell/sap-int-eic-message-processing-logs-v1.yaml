                  IntegrationArtifact: {Id: IntegrationFlow_AdapterData_FAILED_PROCESSING, Name: Integration Flow with Adapter Data - FAILED PROCESSING, Type: INTEGRATION_FLOW, PackageId: PackageId, PackageName: PackageName}
                  LogLevel: INFO
                  CustomStatus: FAILED
                  ArchivingStatus: NOT_RELEVANT
                  ArchivingSenderChannelMessages: 'false'
                  ArchivingReceiverChannelMessages: 'false'
                  ArchivingLogAttachments: 'false'
                  ArchivingPersistedMessages: 'false'
                  TransactionId: a1c611b381a7466fa5e30bb991876a9c
                  PreviousComponentName: CPI_cpisbsa1
                  LocalComponentName: CPI_cpisbsa1
                  OriginComponentName: null
                  CustomHeaderProperties:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq571kVtZ0shxJbJTj05LIFsKQf'')/CustomHeaderProperties'}
                  MessageStoreEntries:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq571kVtZ0shxJbJTj05LIFsKQf'')/MessageStoreEntries'}
                  ErrorInformation:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq571kVtZ0shxJbJTj05LIFsKQf'')/ErrorInformation'}
                  AdapterAttributes:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq571kVtZ0shxJbJTj05LIFsKQf'')/AdapterAttributes'}
