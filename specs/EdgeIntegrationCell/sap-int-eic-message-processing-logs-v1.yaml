swagger: '2.0'
info:
  title: Message Processing Logs
  version: 1.0.0
  description: "Message processing logs enable you to access data about the messages processed on your Edge Integration Cell runtime and - for each processed message - information about the individual processing steps.  \nThis API is implemented based on OData version 2 specification."
externalDocs: {description: 'SAP Integration Suite documentation: OData API - Message Monitoring', url: 'https://help.sap.com/docs/SAP_INTEGRATION_SUITE/51ab953548be4459bfe8539ecaeee98d/827a2d7e9c6f4866a1d6c0e647bcacd2.html'}
x-sap-api-type: ODATA
x-sap-shortText: Get an overview of the messages processed on your Edge Integration Cell runtime and get the details for individual messages.
schemes: [https]
x-sap-hub-capabilities: {try-out: false}
basePath: /local/api/v1
x-servers:
- url: https://{API Virtual Host}/local/api/v1
  description: Local OData API Access for Edge Integration Cell - see (https://help.sap.com/docs/SAP_INTEGRATION_SUITE/51ab953548be4459bfe8539ecaeee98d/a17fa4df7744455c8a35d1c3c2e45787.html)
  templates:
    API Virtual Host: {description: The Virtual Host that you have defined for your Edge Integration Cell in the Edge Lifecycle Management.}
securityDefinitions:
  BasicAuthentication: {type: basic, description: 'You can check the following documentation for the supported authentication methods: https://help.sap.com/docs/SAP_INTEGRATION_SUITE/51ab953548be4459bfe8539ecaeee98d/a17fa4df7744455c8a35d1c3c2e45787.html'}
security:
- BasicAuthentication: []
consumes: [application/json]
produces: [application/json]
tags:
- {name: Logs}
- {name: Adapter Attributes}
- {name: Attachments}
- {name: Custom Header Properties}
- {name: Error Information}
paths:
  /MessageProcessingLogs:
    get:
      description: You can use the following request to get all message processing logs.
      summary: Get all message processing logs.
      tags: [Logs]
      parameters:
      - name: $inlinecount
        in: query
        description: Count the number of retrieved entries by selecting ```allpages```.
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [allpages]
      - {$ref: '#/parameters/top'}
      - {$ref: '#/parameters/skip'}
      - name: $filter
        in: query
        description: |-
          Filter items by property values.<br>
          For any Id filter use only the 'eq' operator.<br>
          Example: ```Status eq 'FAILED'``` returns message processing logs with status 'FAILED'.<br>
          IntegrationFlowName is deprecated. In queries filtering for IntegrationFlowName, this will be substituted automatically by IntegrationFlow/Id
        type: string
      - name: $orderby
        in: query
        description: |-
          Order items by property values.<br>
          IntegrationFlowName is deprecated.
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [LogEnd, LogEnd desc, LogStart, LogStart desc, 'Status,LogEnd desc', ApplicationMessageId]
      - name: $select
        in: query
        description: Select properties to be returned.
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [MessageGuid, CorrelationId, ApplicationMessageId, PredecessorMessageGuid, ApplicationMessageType, IntegrationFlowName, IntegrationArtifact, Status, CustomStatus, LogLevel, LogStart, LogEnd, Sender, Receiver, AlternateWebLink, ArchivingStatus, ArchivingSenderChannelMessages, ArchivingReceiverChannelMessages, ArchivingLogAttachments, ArchivingPersistedMessages]
      responses:
        '200':
          description: Retrieved message processing logs
          schema:
            title: Collection of MessageProcessingLog
            type: object
            properties:
              d:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/com.sap.hci.api.MessageProcessingLog'}
          examples:
            application/json:
              d:
                results:
                - MessageGuid: AFq478Bblxi4wCjBcDb_G0vAGGZG
                  CorrelationId: AFq478Bmn-aPieAWVy0mMGPLWsjx
                  ApplicationMessageId: null
                  PredecessorMessageGuid: null
                  ApplicationMessageType: null
                  LogStart: /Date(1522069440003)/
                  LogEnd: /Date(1522069440200)/
                  Sender: null
                  Receiver: null
                  IntegrationFlowName: IntegrationFlow_AdapterData_FAILED_PROCESSING
                  Status: FAILED
                  AlternateWebLink: https://api.virtual.host/itspaces/shell/monitoring/MessageDetails/%7B%22messageGuid%22%3A%22AFq478Bblxi4wCjBcDb_G0vAGGZG%22%7D
                  IntegrationArtifact: {Id: IntegrationFlow_AdapterData_FAILED_PROCESSING, Name: Integration Flow with Adapter Data - FAILED PROCESSING, Type: INTEGRATION_FLOW, PackageId: PackageId, PackageName: PackageName}
                  LogLevel: INFO
                  CustomStatus: FAILED
                  ArchivingStatus: NOT_RELEVANT
                  ArchivingSenderChannelMessages: 'false'
                  ArchivingReceiverChannelMessages: 'false'
                  ArchivingLogAttachments: 'false'
                  ArchivingPersistedMessages: 'false'
                  TransactionId: 636260297acc487198a65955d3648c49
                  PreviousComponentName: CPI_cpisbsa1
                  LocalComponentName: CPI_cpisbsa1
                  OriginComponentName: null
                  CustomHeaderProperties:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/CustomHeaderProperties'}
                  MessageStoreEntries:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/MessageStoreEntries'}
                  ErrorInformation:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/ErrorInformation'}
                  AdapterAttributes:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/AdapterAttributes'}
                  Attachments:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/Attachments'}
                  Runs:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageProcessingLogs(''AFq478Bblxi4wCjBcDb_G0vAGGZG'')/Runs'}
                - MessageGuid: AFq571kVtZ0shxJbJTj05LIFsKQf
                  CorrelationId: AFq571ngxrynvRfJauu1Y5XKBon-
                  ApplicationMessageId: null
                  PredecessorMessageGuid: null
