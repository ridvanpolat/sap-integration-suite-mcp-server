            title: Collection of MessageProcessingLogAdapterAttribute
            type: object
            properties:
              d:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/com.sap.hci.api.MessageProcessingLogAdapterAttribute'}
          examples:
