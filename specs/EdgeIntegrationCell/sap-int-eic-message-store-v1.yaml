    title: Variables
  com.sap.hci.api.MessagingQueue:
    type: object
    description: Public queue entity. JSON property names are camelCase. **`numberOfMessages`** is the combined customer-visible depth (processing queue plus failed sibling), aligned with the legacy Web UI count.
    properties:
      queueName: {type: string}
      numberOfMessages: {description: Customer-visible queue depth., type: string}
      active: {type: boolean}
      exclusive: {type: boolean}
    title: MessagingQueue
  com.sap.hci.api.MessagingMessage:
    type: object
    description: Public message entity. JSON property names are camelCase. **`jmsMessageId`** uses the hex encoding form when required for URL safety.
    properties:
      jmsMessageId: {type: string}
      queueName: {type: string}
      failed: {type: boolean}
      mplId: {type: string}
      createdAt: {type: string, description: Epoch milliseconds (string representation).}
      retryCount: {type: string, description: Retry counter (string representation).}
      nextRetry: {type: string, description: Epoch milliseconds of next retry (string representation).}
      overdueAt: {type: string, description: Epoch milliseconds when message becomes overdue (string representation).}
      expirationDate: {type: string, description: Epoch milliseconds of expiration (string representation).}
      sender: {type: string}
      receiver: {type: string}
      messageType: {type: string}
      applicationId: {type: string}
      correlationId: {type: string}
    title: MessagingMessage
  com.sap.hci.api.MutationSuccess:
    type: object
    required: [operation, processedCount]
    description: Minimal success body for synchronous delete, move, and retry operations.
    properties:
      operation:
        type: string
        enum: [DELETE, MOVE, RETRY]
      processedCount:
        type: integer
        minimum: 0
        description: |
          Reported count for the operation. Whole-queue move/retry use the
          pre-call customer-visible queue depth; filter/id-list modes report
          the dispatched count for that call. Delete always returns **1**.
    title: MutationSuccess
  com.sap.hci.api.MoveMessagingMessagesRequest:
    type: object
    required: [sourceQueue, targetQueue]
    properties:
      sourceQueue: {type: string}
      targetQueue: {type: string}
      jmsMessageId: {type: string}
