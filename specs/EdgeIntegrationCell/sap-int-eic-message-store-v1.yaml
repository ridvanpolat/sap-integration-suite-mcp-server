        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /RetryMessagingMessages:
    post:
      tags: [JMS Resources]
      summary: Retry messages on error queue
      description: |
        JSON body — **`RetryMessagingMessagesRequest`**. Retry eligibility follows broker rules (**failed** rows).
      parameters:
      - in: body
        name: body
        required: true
        schema: {$ref: '#/definitions/com.sap.hci.api.RetryMessagingMessagesRequest'}
        description: Configuration for retry messages request.
      responses:
        '200':
          description: Success — retry completed synchronously.
          schema: {$ref: '#/definitions/com.sap.hci.api.MutationSuccess'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
