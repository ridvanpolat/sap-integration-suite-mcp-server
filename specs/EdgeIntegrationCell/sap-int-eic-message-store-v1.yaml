swagger: '2.0'
info:
  title: Message Stores
  version: 1.0.0
  description: "Message store enables you get data for processed messages. You can access the stored message and analyze it at a later point in time. An integration flow stores messages in a message store through the Persist step for 90 days.  \nAdditionally, you can get information on the JMS resources available on your Edge Integration Cell runtime as well as on those actually used by your integration flows.  \nThis API is implemented based on OData version 2 specification."
externalDocs: {description: 'SAP Integration Suite documentation: OData API - Message Store', url: 'https://help.sap.com/docs/SAP_INTEGRATION_SUITE/51ab953548be4459bfe8539ecaeee98d/1aab5e9482f545539a7caae3e9887e4e.html'}
x-sap-api-type: ODATA
x-sap-shortText: Access message store entries, JMS resources and data store entries.
schemes: [https]
x-sap-hub-capabilities: {try-out: false}
basePath: /local/api/v1
x-servers:
- url: https://{API Virtual Host}/local/api/v1
  description: Local OData API Access for Edge Integration Cell - see (https://help.sap.com/docs/SAP_INTEGRATION_SUITE/51ab953548be4459bfe8539ecaeee98d/a17fa4df7744455c8a35d1c3c2e45787.html)
  templates:
    API Virtual Host: {description: The Virtual Host that you have defined for your Edge Integration Cell in the Edge Lifecycle Management.}
securityDefinitions:
  BasicAuthentication: {type: basic, description: 'You can check the following documentation for the supported authentication methods: https://help.sap.com/docs/SAP_INTEGRATION_SUITE/51ab953548be4459bfe8539ecaeee98d/a17fa4df7744455c8a35d1c3c2e45787.html'}
security:
- BasicAuthentication: []
consumes: [application/json]
produces: [application/json]
tags:
- {name: Entries}
- {name: Entry Attachments}
- {name: Entry Attachment Properties}
- {name: Entry Properties}
- {name: JMS Resources}
- {name: Data Stores}
- {name: Variables}
paths:
  /MessageProcessingLogs('{MessageGuid}')/MessageStoreEntries:
    get:
      description: You can use the following request to get message store entries for the specified message Guid.
      summary: Get message store entries by message Guid.
      tags: [Entries]
      parameters:
      - {name: MessageGuid, in: path, required: true, description: Guid of the message for which the message processing log is written, type: string}
      responses:
        '200':
          description: Retrieved entities
          schema:
            title: Collection of MessageStoreEntry
            type: object
            properties:
              d:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/com.sap.hci.api.MessageStoreEntry'}
          examples:
            application/json:
              d:
                results:
                - Id: sap-it-res:msg:ae15c0dda:111e8e08-7a44-4dd1-a0b5-0586105591cb
                  MessageGuid: AFrAl1wLhV2Mkzho92oqdym8bq5v
                  MessageStoreId: Persist1
                  TimeStamp: /Date(1522571100123)/
                  HasAttachments: true
                  Attachments:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageStoreEntries(''sap-it-res%3Amsg%3Aae15c0dda%3Ad6d3eee7-0b8e-4279-acd5-d5cbd22994e5'')/Attachments'}
                  Properties:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageStoreEntries(''sap-it-res%3Amsg%3Aae15c0dda%3Ad6d3eee7-0b8e-4279-acd5-d5cbd22994e5'')/Properties'}
                - Id: sap-it-res:msg:ae15c0dda:531e5acb-05cb-4835-a45a-86fbdac0508a
                  MessageGuid: AFq5745rgi7C6E2IVlCM22lEmgDt
                  MessageStoreId: Persist2
                  TimeStamp: /Date(1522134926543)/
                  HasAttachments: true
                  Attachments:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageStoreEntries(''sap-it-res%3Amsg%3Aae15c0dda%3A531e5acb-05cb-4835-a45a-86fbdac0508a'')/Attachments'}
                  Properties:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageStoreEntries(''sap-it-res%3Amsg%3Aae15c0dda%3A531e5acb-05cb-4835-a45a-86fbdac0508a'')/Properties'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageStoreEntries('{MessageStoreEntryId}'):
    get:
      description: You can use the following request to get an entry from message store for a specific entry Id.
      summary: Get message store entry by Id.
      tags: [Entries]
      parameters:
      - {name: MessageStoreEntryId, in: path, required: true, description: Message store entry Id, type: string}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: MessageStoreEntry
            type: object
            properties:
              d: {$ref: '#/definitions/com.sap.hci.api.MessageStoreEntry'}
          examples:
            application/json:
              d:
                Id: sap-it-res:msg:ae15c0dda:111e8e08-7a44-4dd1-a0b5-0586105591cb
                MessageGuid: AFrAl1wLhV2Mkzho92oqdym8bq5v
                MessageStoreId: Persist1
                TimeStamp: /Date(1522571100123)/
                HasAttachments: true
                Attachments:
                  __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageStoreEntries(''sap-it-res%3Amsg%3Aae15c0dda%3Ad6d3eee7-0b8e-4279-acd5-d5cbd22994e5'')/Attachments'}
                Properties:
                  __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageStoreEntries(''sap-it-res%3Amsg%3Aae15c0dda%3Ad6d3eee7-0b8e-4279-acd5-d5cbd22994e5'')/Properties'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageStoreEntries('{MessageStoreEntryId}')/$value:
    get:
      description: You can use the following request to get a message payload from message store for a specific entry Id.
      summary: Get message payload from message store by entry Id.
      tags: [Entries]
      parameters:
      - {name: MessageStoreEntryId, in: path, required: true, description: Message store entry Id, type: string}
      responses:
        '200': {description: Retrieved payload of message store entry}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageStoreEntries('{MessageStoreEntryId}')/Attachments:
    get:
      description: You can use the following request to get all attachments from the message store entry with the specified entry Id.
      summary: Get attachments from message store by entry Id.
      tags: [Entry Attachments]
      parameters:
      - {name: MessageStoreEntryId, in: path, required: true, description: Message store entry Id, type: string}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: Collection of MessageStoreEntryAttachment
            type: object
            properties:
              d:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/com.sap.hci.api.MessageStoreEntryAttachment'}
          examples:
            application/json:
              d:
                results:
                - Id: sap-it-res:att:ae15c0dda:2c79e3ef-fc37-43b0-80a7-73a8467cda43
                  Name: attachment1.html
                  ContentType: text/html; charset=iso-8859-1
                  Properties:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageStoreEntryAttachments(''sap-it-res%3Aatt%3Aae15c0dda%3A2c79e3ef-fc37-43b0-80a7-73a8467cda43'')/Properties'}
                - Id: sap-it-res:att:ae15c0dda:9c787b0e-0fd6-4088-a0dc-67178eccc4f6
                  Name: attachment2.html
                  ContentType: text/html; charset=iso-8859-1
                  Properties:
                    __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageStoreEntryAttachments(''sap-it-res%3Aatt%3Aae15c0dda%3A9c787b0e-0fd6-4088-a0dc-67178eccc4f6'')/Properties'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageStoreEntryAttachments('{MessageStoreEntryAttachmentId}'):
    get:
      description: You can use the following request to get the attachment of a message store entry with the specified attachment Id.
      summary: Get attachment from message store by attachment Id.
      tags: [Entry Attachments]
      parameters:
      - {name: MessageStoreEntryAttachmentId, in: path, required: true, description: Attachment Id of the message store entry, type: string}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: MessageStoreEntryAttachment
            type: object
            properties:
              d: {$ref: '#/definitions/com.sap.hci.api.MessageStoreEntryAttachment'}
          examples:
            application/json:
              d:
                Id: sap-it-res:att:ae15c0dda:2c79e3ef-fc37-43b0-80a7-73a8467cda43
                Name: attachment1.html
                ContentType: text/html; charset=iso-8859-1
                Properties:
                  __deferred: {uri: 'https://api.virtual.host/local/api/v1/MessageStoreEntryAttachments(''sap-it-res%3Aatt%3Aae15c0dda%3A2c79e3ef-fc37-43b0-80a7-73a8467cda43'')/Properties'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageStoreEntryAttachments('{MessageStoreEntryAttachmentId}')/$value:
    get:
      description: You can use the following request to get the attachment content of a message store entry with the specified Id.
      summary: Get attachment content from message store by attachment Id.
      tags: [Entry Attachments]
      produces: [application/octet-stream]
      parameters:
      - {name: MessageStoreEntryAttachmentId, in: path, required: true, description: Attachment Id of a message store entry, type: string}
      responses:
        '200': {description: Retrieved attachment content of message store entry}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageStoreEntryAttachments('{MessageStoreEntryAttachmentId}')/Properties:
    get:
      description: You can use the following request to get attachment properties of a message store entry for the specified attachment Id.
      summary: Get attachment properties from message store by attachment Id.
      tags: [Entry Attachment Properties]
      parameters:
      - {name: MessageStoreEntryAttachmentId, in: path, required: true, description: Attachment Id of a message store entry, type: string}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: Collection of MessageStoreEntryAttachmentProperty
            type: object
            properties:
              d:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/com.sap.hci.api.MessageStoreEntryAttachmentProperty'}
          examples:
            application/json:
              d:
                results:
                - {AttachmentId: 'sap-it-res:att:ae15c0dda:2c79e3ef-fc37-43b0-80a7-73a8467cda43', Name: Content-type, Value: text/html; charset=iso-8859-1}
                - {AttachmentId: 'sap-it-res:att:ae15c0dda:2c79e3ef-fc37-43b0-80a7-73a8467cda43', Name: Content-Disposition, Value: attachment; filename="attachment1.html"}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageStoreEntryAttachmentProperties(AttachmentId='{MessageStoreEntryAttachmentId}',Name='{Name}'):
    get:
      description: You can use the following request to get attachment properties of a message store entry for the specified attachment Id and property name.
      summary: Get attachment properties from message store by attachment Id and property name.
      tags: [Entry Attachment Properties]
      parameters:
      - {name: MessageStoreEntryAttachmentId, in: path, required: true, description: Attachment Id of a message store entry, type: string}
      - {name: Name, in: path, required: true, description: Property name of the attachment for a message store entry, type: string}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: MessageStoreEntryAttachmentProperty
            type: object
            properties:
              d: {$ref: '#/definitions/com.sap.hci.api.MessageStoreEntryAttachmentProperty'}
          examples:
            application/json:
              d: {AttachmentId: 'sap-it-res:att:ae15c0dda:2c79e3ef-fc37-43b0-80a7-73a8467cda43', Name: Content-Disposition, Value: attachment; filename="attachment1.html"}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageStoreEntries('{MessageStoreEntryId}')/Properties:
    get:
      description: You can use the following request to get all properties of a message store entry for the specified entry Id.
      summary: Get all properties of message store by entry Id.
      tags: [Entry Properties]
      parameters:
      - {name: MessageStoreEntryId, in: path, required: true, description: Message store entry Id, type: string}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: Collection of MessageStoreEntryProperty
            type: object
            properties:
              d:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/com.sap.hci.api.MessageStoreEntryProperty'}
          examples:
            application/json:
              d:
                results:
                - {MessageId: 'sap-it-res:msg:ae15c0dda:111e8e08-7a44-4dd1-a0b5-0586105591cb', Name: X-receiver, Value: <testrecipient@nonexistent.wdf.sap.corp>}
                - {MessageId: 'sap-it-res:msg:ae15c0dda:111e8e08-7a44-4dd1-a0b5-0586105591cb', Name: TestHeader, Value: Header Value}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessageStoreEntryProperties(MessageId='{MessageStoreEntryID}',Name='{PropertyName}'):
    get:
      description: You can use the following request to get a property of a message store entry for the specified entry Id and property name.
      summary: Get property from message store by entry Id and property name.
      tags: [Entry Properties]
      parameters:
      - {name: MessageStoreEntryID, in: path, required: true, description: Message store entry Id, type: string}
      - {name: PropertyName, in: path, required: true, description: Property name for the message store entry, type: string}
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: MessageStoreEntryProperty
            type: object
            properties:
              d: {$ref: '#/definitions/com.sap.hci.api.MessageStoreEntryProperty'}
          examples:
            application/json:
              d: {MessageId: 'sap-it-res:msg:ae15c0dda:111e8e08-7a44-4dd1-a0b5-0586105591cb', Name: X-receiver, Value: <testrecipient@nonexistent.wdf.sap.corp>}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /JmsBrokers('Broker1'):
    get:
      description: "You can use the following request to get information on the JMS resources available on your Edge Integration Cell runtime as well as on those actually used by your integration flows.<br>\n\nAdditional information about response values for some attributes: \n* __IsTransactedSessionsHigh__: \n__0__ - enough transactions available \n__1__ - number of transactions exceeding the allowed limit \n* __IsConsumerHigh__: \n__0__ - enough consumer available \n__1__ - number of consumers exceeding the allowed limits \n* __IsProducersHigh__: \n__0__ - enough producers available \n__1__ - number of producers exceeding the allowed limit"
      summary: Get available resources of JMS queues.
      tags: [JMS Resources]
      parameters:
      - name: $expand
        in: query
        description: Expand related entities.
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [QueueStates, InactiveQueues]
      responses:
        '200':
          description: Retrieved entity with expand on queue states
          schema: {$ref: '#/definitions/com.sap.hci.api.JmsBrokerQueueStates'}
          examples:
            application/json:
              d:
                Key: Broker1
                Capacity: '794616135'
                MaxCapacity: '9751756800'
                IsTransactedSessionsHigh: 0
                IsConsumersHigh: 0
                IsProducersHigh: 0
                MaxQueueNumber: '30'
                QueueNumber: '16'
                CapacityOk: '16'
                CapacityWarning: '0'
                CapacityError: '0'
                QueueStates:
                  results:
                  - Name: CC
                    State: '0'
                    Broker:
                      __deferred: {uri: 'https://api.virtual.host/local/api/v1/QueueStates(''CC'')/Broker'}
                  - Name: TEST2
                    State: '0'
                    Broker:
                      __deferred: {uri: 'https://api.virtual.host/local/api/v1/QueueStates(''TEST2'')/Broker'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessagingQueues:
    get:
      tags: [JMS Resources]
      summary: List queues
      description: |
        Returns all queues for the tenant. **`$top`/`$skip`/…** ignored;
        **`$filter`/`$select`/…** → **400** (see API description).
      parameters:
      - {$ref: '#/parameters/QueryFormat'}
      - {$ref: '#/parameters/count'}
      responses:
        '200':
          description: OK — feed of **`MessagingQueue`** entries (`d.results`).
          headers:
            sap-correlation-id: {type: string}
          schema:
            type: object
            properties:
              d:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/com.sap.hci.api.MessagingQueue'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessagingQueues('{queueName}'):
    get:
      tags: [JMS Resources]
      summary: Read one queue
      description: Returns queue by name.
      parameters:
      - {$ref: '#/parameters/QueueNameQuoted'}
      - {$ref: '#/parameters/QueryFormat'}
      responses:
        '200':
          description: Success
          schema:
            type: object
            properties:
              d: {$ref: '#/definitions/com.sap.hci.api.MessagingQueue'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
    delete:
      tags: [JMS Resources]
      summary: Delete queue
      description: |
        Deletes the queue when permitted. By default the queue must be **empty**
        (including sibling **`E.`** / **`C.`** queues). Pass **`forceDelete=true`**
        to delete and discard remaining messages. **`400 QUEUE_IN_USE`** when
        deployed flows still reference the queue; **`409 QUEUE_NOT_EMPTY`** when
        messages remain and **`forceDelete`** is not **`true`**.
      parameters:
      - {$ref: '#/parameters/QueueNameQuoted'}
      - {$ref: '#/parameters/QueryForceDelete'}
      responses:
        '200':
          description: Success — queue deleted.
          schema: {$ref: '#/definitions/com.sap.hci.api.MutationSuccess'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '409': {$ref: '#/responses/409'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessagingQueues('{queueName}')/MessagingMessages:
    get:
      tags: [JMS Resources]
      summary: List messages in a queue (capped feed)
      description: |
        Named filters only — **`$top`/`$skip`/…** ignored (not applied). At most
        **`pageSize`** rows (default from **`JMS_ODATA_PUBLIC_PAGE_SIZE`**). No
        **`Warning`** header when the matching set exceeds the cap.
      parameters:
      - {$ref: '#/parameters/QueueNameQuoted'}
      - {$ref: '#/parameters/QueryFormat'}
      - {$ref: '#/parameters/FilterJmsMessageId'}
      - {$ref: '#/parameters/FilterMessageIdLegacyAlias'}
      - {$ref: '#/parameters/FilterCorrelationId'}
      - {$ref: '#/parameters/FilterSender'}
      - {$ref: '#/parameters/FilterReceiver'}
      - {$ref: '#/parameters/FilterMplId'}
      - {$ref: '#/parameters/FilterMessageType'}
      - {$ref: '#/parameters/FilterApplicationId'}
      - {$ref: '#/parameters/FilterCreatedAfter'}
      - {$ref: '#/parameters/FilterCreatedBefore'}
      - {$ref: '#/parameters/FilterPageSize'}
      responses:
        '200':
          description: Success — `d.results` (**≤ page-size rows**; silent cap when more match).
          headers:
            sap-correlation-id: {type: string}
          schema:
            type: object
            properties:
              d:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/com.sap.hci.api.MessagingMessage'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessagingMessages(jmsMessageId='{jmsMessageId}',queueName='{queueName}'):
    get:
      tags: [JMS Resources]
      summary: Read one message (canonical key path example)
      description: |
        Equivalent navigation URL **`…/MessagingQueues('{queueName}')/MessagingMessages(jmsMessageId='…',queueName='…')`** is also supported.
      parameters:
      - name: jmsMessageId
        in: path
        required: true
        type: string
        description: |
          Message id segment (**hex form `x-hex-…`** when needed). Resolver also accepts key literal **`jmsMessageId`** on the wire — follow **`$metadata`** for alternate spellings.
      - {name: queueName, in: path, required: true, type: string, description: JMS queue name., x-example: QueueName1}
      - {$ref: '#/parameters/QueryFormat'}
      responses:
        '200':
          description: Success
          headers:
            sap-correlation-id: {type: string}
          schema:
            type: object
            properties:
              d: {$ref: '#/definitions/com.sap.hci.api.MessagingMessage'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
    delete:
      tags: [JMS Resources]
      summary: Delete one message
      description: Delete a message from the specified JMS queue
      parameters:
      - name: jmsMessageId
        in: path
        required: true
        type: string
        description: |
          Message id segment (**hex form `x-hex-…`** when needed). Resolver also accepts key literal **`jmsMessageId`** on the wire — follow **`$metadata`** for alternate spellings.
      - {name: queueName, in: path, required: true, type: string, description: JMS queue name., x-example: QueueName1}
      responses:
        '200':
          description: Success — message deleted.
          schema: {$ref: '#/definitions/com.sap.hci.api.MutationSuccess'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
  /MessagingMessages(jmsMessageId='{jmsMessageId}',queueName='{queueName}')/$value:
    get:
      tags: [JMS Resources]
      summary: Download message payload bytes
      description: Download the payload of a JMS message with the specified ID and queue name.
      produces: [application/octet-stream]
      parameters:
      - name: jmsMessageId
        in: path
        required: true
        type: string
        description: |
          Message id segment (**hex form `x-hex-…`** when needed). Resolver also accepts key literal **`jmsMessageId`** on the wire — follow **`$metadata`** for alternate spellings.
      - {name: queueName, in: path, required: true, type: string, description: JMS queue name., x-example: QueueName1}
      responses:
        '200':
          description: Success — raw bytes (`Content-Type` from stored message metadata when available).
          schema: {type: string, format: binary}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
