      produces: [application/json]
      parameters:
      - name: Hexagency
        in: path
        required: true
        description: |-
          Hexadecimal value in string format of the values for Agency <br>
          Example: ```4167656E637958595A```
        type: string
      - name: Hexscheme
        in: path
        required: true
        description: |-
          Hexadecimal value in string format of the values for Schema <br>
          Example: ```4C4F4E47```
