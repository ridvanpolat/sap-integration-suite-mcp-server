swagger: '2.0'
info:
  title: Partner Directory
  version: 1.0.0
  description: "Partner Directory enables you to read, change or delete information on partners that are connected to an Edge Integration Cell in the context of a larger network. Information stored in the Partner Directory can be used to parameterize integration flows. In addition to the read-only access with the local OData API (__Local Access__), the full set of CRUD operations is supported by the __Cloud Access__ which forwards the requests to the selected Edge Integration Cell runtime. \nThis API is implemented based on OData version 2 specification."
externalDocs: {description: 'SAP Integration Suite documentation: OData API - Partner Directory', url: 'https://help.sap.com/docs/SAP_INTEGRATION_SUITE/9519789d5664487f8b9cd89eba514477/0fe80dc9d3be4dfbbb89ee4c791d326e.html'}
x-sap-api-type: ODATA
x-sap-shortText: Access the Partner Directory to maintain and manage data.
schemes: [https]
basePath: /api/v1
x-sap-hub-capabilities: {try-out: false}
x-servers:
- url: https://{API Host URL}.hana.ondemand.com/location/{Edge Runtime Location}/api/v1
  description: Cloud OData API access for Edge Integration Cell - see [Configuring Custom Domains](https://help.sap.com/viewer/368c481cd6954bdfa5d0435479fd4eaf/Cloud/en-US/7230b9ff41914cc0969223e6a020104b.html) and [HTTP Calls and URI Components](https://help.sap.com/docs/cloud-integration/sap-cloud-integration/http-calls-and-uri-components)
  templates:
    API Host URL: {description: Defined service root URL (url parameter from service key) for your Cloud Integration account.}
    Edge Runtime Location: {description: The identifier of your Edge Integration Cell runtime.}
- url: https://{API Virtual Host}/local/api/v1
  description: Local OData API Access for Edge Integration Cell - see (https://help.sap.com/docs/SAP_INTEGRATION_SUITE/51ab953548be4459bfe8539ecaeee98d/a17fa4df7744455c8a35d1c3c2e45787.html)
  templates:
    API Virtual Host: {description: The Virtual Host that you have defined for your Edge Integration Cell in the Edge Lifecycle Management.}
securityDefinitions:
  BasicAuthentication: {type: basic}
security:
- BasicAuthentication: []
consumes: [application/json]
tags:
- {name: Alternative Partners (Local Access)}
- {name: Alternative Partners (Cloud Access)}
- {name: Authorized Users (Local Access)}
- {name: Authorized Users (Cloud Access)}
- {name: Binary Parameters (Local Access)}
- {name: Binary Parameters (Cloud Access)}
- {name: Partners (Local Access)}
- {name: Partners (Cloud Access)}
- {name: String Parameters (Local Access)}
- {name: String Parameters (Cloud Access)}
- {name: CSRF Token Handling}
paths:
  /AlternativePartners:
    get:
      description: You can use the following request to get all alternative partners.
      summary: Get all alternative partners.
      tags: [Alternative Partners (Local Access), Alternative Partners (Cloud Access)]
      produces: [application/json]
      parameters:
      - {$ref: '#/parameters/top'}
      - {$ref: '#/parameters/skip'}
      - {$ref: '#/parameters/filter'}
      - name: $orderby
        in: query
        description: Order items by property values
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [Hexagency, Hexagency desc, Hexscheme, Hexscheme desc, Hexid, Hexid desc, Agency, Agency desc, Scheme, Scheme desc, Id, Id desc, Pid, Pid desc, LastModifiedBy, LastModifiedBy desc, LastModifiedTime, LastModifiedTime desc, CreatedBy, CreatedBy desc, CreatedTime, CreatedTime desc]
      - name: $select
        in: query
        description: Select properties to be returned.
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [Hexagency, Hexscheme, Hexid, Agency, Scheme, Id, Pid, LastModifiedBy, LastModifiedTime, CreatedBy, CreatedTime]
      responses:
        '200':
          description: Retrieved entities
          schema:
            title: Collection of AlternativePartner
            type: object
            properties:
              d:
                type: object
                properties:
                  results:
                    type: array
                    items: {$ref: '#/definitions/com.sap.hci.api.AlternativePartner'}
          examples:
            application/json:
              d:
                results:
                - {Hexagency: 4167656E637958595A, Hexscheme: 4C4F4E47, Hexid: 5265636569766572205072656D69756D, Agency: AgencyXYZ, Scheme: LONG, Id: Receiver Premium, Pid: Receiver_1, LastModifiedBy: Tester, LastModifiedTime: /Date(1516202310720)/, CreatedBy: Tester, CreatedTime: /Date(1516202310720)/}
                - {Hexagency: 4167656E637958595A, Hexscheme: 4C4F4E47, Hexid: '52656365697665722032', Agency: AgencyXYZ, Scheme: LONG, Id: Receiver 2, Pid: Receiver_2, LastModifiedBy: Tester, LastModifiedTime: /Date(1516202310926)/, CreatedBy: Tester, CreatedTime: /Date(1516202310926)/}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
    post:
      description: |-
        You can use the following request to add new alternative partner.<br>
        In API sandbox only read APIs could be tested. You need to configure an API endpoint for your account, where you have the required write permissions to update the partner directory. __This operation is only available via cloud endpoint.__
      summary: Add new alternative partner.
      tags: [Alternative Partners (Cloud Access)]
      produces: [application/json]
      parameters:
      - name: AlternativePartner
        in: body
        description: New entity
        schema: {$ref: '#/definitions/com.sap.hci.api.AlternativePartner-create'}
      - {description: CSRF token that is valid for the current session (see resource 'CSRF Token Handling')., in: header, name: X-CSRF-Token, type: string, required: true}
      responses:
        '201':
          description: Created entity
          schema: {$ref: '#/definitions/com.sap.hci.api.AlternativePartner'}
          examples:
            application/json:
              d: {Hexagency: 4167656E637958595A, Hexscheme: 4C4F4E47, Hexid: 5265636569766572205072656D69756D, Agency: AgencyXYZ, Scheme: LONG, Id: Receiver Premium, Pid: Receiver_1, LastModifiedBy: Tester, LastModifiedTime: /Date(1516202310720)/, CreatedBy: Tester, CreatedTime: /Date(1516202310720)/}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        '500':
          description: Internal server error - alternative partner already exists or the request body does not contain the required attributes.
          examples:
            application/json:
              error:
                code: Internal Server Error
                message:
                  lang: en
                  value: |
                    Problem during creating an entity: Inserting Alternative Partner ID with ID <ID>, scheme <scheme>, and agency <agency> failed: Attempt to insert duplicate key row in object 'ITPD_ALTERNATIVE_PIDS' with unique index 'ITPD_ALTERNATIVE_PIDS_PK'
        default: {$ref: '#/responses/error'}
  /AlternativePartners(Hexagency='{Hexagency}',Hexscheme='{Hexscheme}',Hexid='{Hexid}'):
    get:
      description: You can use the following request to get an alternative partner by key fields.
      summary: Get alternative partner by key fields.
