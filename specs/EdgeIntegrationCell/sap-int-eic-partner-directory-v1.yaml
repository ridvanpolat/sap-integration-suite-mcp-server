        type: array
        uniqueItems: true
        items:
          type: string
          enum: [Agency, Scheme, Id, Pid, LastModifiedBy, LastModifiedTime, CreatedBy, CreatedTime]
      responses:
        '200':
          description: Retrieved entity
          schema:
            title: AlternativePartner
            type: object
            properties:
              d: {$ref: '#/definitions/com.sap.hci.api.AlternativePartner'}
          examples:
            application/json:
              d: {Hexagency: 4167656E637958595A, Hexscheme: 4C4F4E47, Hexid: 5265636569766572205072656D69756D, Agency: AgencyXYZ, Scheme: LONG, Id: Receiver Premium, Pid: Receiver_1, LastModifiedBy: Tester, LastModifiedTime: /Date(1516202310720)/, CreatedBy: Tester, CreatedTime: /Date(1516202310720)/}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        default: {$ref: '#/responses/error'}
    put:
      description: |-
        You can use the following request to update alternative partner.<br>
        In API sandbox only read APIs could be tested. You need to configure an API endpoint for your account, where you have the required write permissions to update the partner directory. __This operation is only available via cloud endpoint.__
      summary: Update alternative partner.
      tags: [Alternative Partners (Cloud Access)]
      produces: [application/json]
      parameters:
      - name: Hexagency
        in: path
        required: true
        description: |-
          Hexadecimal value in string format of the values for Agency <br>
          Example: ```4167656E637958595A```
        type: string
      - name: Hexscheme
        in: path
        required: true
        description: |-
          Hexadecimal value in string format of the values for Schema <br>
          Example: ```4C4F4E47```
        type: string
      - name: Hexid
        in: path
        required: true
        description: |-
          Hexadecimal values in string format of the values for Id <br>
          Example: ```5265636569766572205072656D69756D```
        type: string
      - name: AlternativePartner
        in: body
        description: New property values
        schema: {$ref: '#/definitions/com.sap.hci.api.AlternativePartner-update'}
      - {description: CSRF token that is valid for the current session (see resource 'CSRF Token Handling'), in: header, name: X-CSRF-Token, type: string, required: true}
      responses:
        '204': {$ref: '#/responses/204'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        '500':
          description: Internal server error - request body does not contain values for expected attributes.
          examples:
            application/json:
              error:
                code: Internal Server Error
                message:
                  lang: en
                  value: |
                    Problem during updating an entity: Updating Alternative Partner ID with Id <Id>, Scheme <scheme>, and Agency <agency> failed: Attempt to insert NULL value into column 'PID', table 'NEO_7U7D8TZA5XSIZT879SZA6YF6Q.NEO_7U7D8TZA5XSIZT879SZA6YF6Q.ITPD_ALTERNATIVE_PIDS'; column does not allow nulls. Update fails.
        default: {$ref: '#/responses/error'}
    delete:
      description: |-
        You can use the following request to delete alternative partner.<br>
        In API sandbox only read APIs could be tested. You need to configure an API endpoint for your account, where you have the required write permissions to update the partner directory. __This operation is only available via cloud endpoint.__
      summary: Delete alternative partner.
      tags: [Alternative Partners (Cloud Access)]
      produces: [application/json]
      parameters:
      - name: Hexagency
        in: path
        required: true
        description: |-
          Hexadecimal value in string format of the values for Agency <br>
          Example: ```4167656E637958595A```
        type: string
      - name: Hexscheme
        in: path
        required: true
        description: |-
          Hexadecimal value in string format of the values for Schema <br>
          Example: ```4C4F4E47```
        type: string
      - name: Hexid
        in: path
        required: true
        description: |-
          Hexadecimal values in string format of the values for Id <br>
          Example: ```5265636569766572205072656D69756D```
        type: string
      - {description: CSRF token that is valid for the current session (see resource 'CSRF Token Handling'), in: header, name: X-CSRF-Token, type: string, required: true}
      responses:
        '204': {$ref: '#/responses/204'}
        '400': {$ref: '#/responses/400'}
        '401': {$ref: '#/responses/401'}
        '403': {$ref: '#/responses/403'}
        '404': {$ref: '#/responses/404'}
        '429': {$ref: '#/responses/429'}
        '500':
          description: Internal server error - wrong parameter values.
          examples:
            application/json:
              error:
                code: Internal Server Error
                message: {lang: en, value: 'Invalid key predicate: ''Hexscheme=''...'',Hexid=''...'''''}
        default: {$ref: '#/responses/error'}
